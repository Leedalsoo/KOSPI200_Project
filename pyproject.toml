[project]

name = "optionproject"

version = "0.1.0"

description = "KOSPI200 futures/options trading application"

requires-python = ">=3.11"

dependencies = [
"websockets>=12.0",
"cryptography>=42.0",

]

[project.optional-dependencies]

test = [
"pytest>=8.0",

]

[tool.pytest.ini_options]

pythonpath = ["."]

testpaths = ["tests"]

[build-system]

requires = ["setuptools>=68"]

build-backend = "setuptools.build_meta"